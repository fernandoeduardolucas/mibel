# Configuração Flyte para execução remota no cluster local (flytectl demo).
# Usado pelo orquestrador run_medallion_consumo_precos.py com:
#   pyflyte run --remote --config workflows/flyte-config.yaml ...
#
# Pré-requisito: cluster Flyte a correr em localhost:30080
#   flytectl demo start --image mibel-flyte:latest
#
# A imagem customizada (01_docker_stack/flyte/Dockerfile) redireciona o
# armazenamento interno do Flyte para o MinIO do Compose via host.docker.internal:9000.
# O host (pyflyte) faz upload para o mesmo MinIO em localhost:9000.

admin:
  # Endpoint do Flyte control plane (flytectl demo K3s)
  endpoint: localhost:30080
  authType: Pkce
  insecure: true

storage:
  # O orquestrador (host) faz upload dos artefactos de fast registration
  # para o MinIO do Compose em localhost:9000.
  # Os pods K3s acedem ao mesmo MinIO via host.docker.internal:9000
  # (configurado em 01_docker_stack/flyte/flyte-core-overrides.yaml).
  type: minio
  connection:
    endpoint: "http://localhost:9000"
    access-key: minioadmin
    secret-key: minioadmin
    disable-ssl: true
    region: us-east-1
  container: "flyte"

logger:
  show-source: true
  level: 0
